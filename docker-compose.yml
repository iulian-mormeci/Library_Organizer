services:
  app:
    build: .
    restart: unless-stopped
    # Matches the file owner UID/GID on the TrueNAS NFS export. Without
    # this, the container runs as root — which NFS root_squash maps to an
    # unprivileged/anonymous user server-side, blocking writes/deletes to
    # files the export doesn't already grant that anonymous user access to.
    # 1000:1000 is node:20-bookworm-slim's built-in "node" user (see the
    # chown in the Dockerfile's runner stage), not an arbitrary number —
    # change both together if your NFS export uses a different UID/GID.
    user: "1000:1000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-music_dedup}:${POSTGRES_PASSWORD:-music_dedup}@postgres:5432/${POSTGRES_DB:-music_dedup}
      LIBRARY_PATH: ${LIBRARY_PATH_IN_CONTAINER:-/music}
      FPCALC_PATH: /usr/bin/fpcalc
      # Not used to gate the actual DELETE decision (that's always a live
      # fs.unlink() result, see src/lib/deleteFile.ts) — passed through so
      # it's visible to the process for diagnostics/logging and so the app
      # and the bind mount below can never silently disagree about it.
      LIBRARY_MOUNT_MODE: ${LIBRARY_MOUNT_MODE:-ro}
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      # Example bind mount for local testing. In production, replace the
      # host side with your real NFS mount from TrueNAS, e.g.:
      #   /mnt/truenas/music:/music
      #
      # LIBRARY_MOUNT_MODE controls the bind mount itself (Docker enforces
      # this at the container's mount namespace, independently of whatever
      # permissions the underlying NFS export actually has) — it defaults
      # to "ro" for safety. Setting LIBRARY_MOUNT_MODE=rw in .env is
      # required for the "Elimina" button in the UI to actually remove
      # files (see src/app/api/tracks/[id]/route.ts); after changing it,
      # recreate the container with `docker compose up -d` for the new
      # mount option to take effect — an already-running container keeps
      # whatever mode it started with.
      - ${LIBRARY_PATH_ON_HOST:-./library-example}:/music:${LIBRARY_MOUNT_MODE:-ro}

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-music_dedup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-music_dedup}
      POSTGRES_DB: ${POSTGRES_DB:-music_dedup}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-music_dedup}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
